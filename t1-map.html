<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>REBORN新生留学 · 地图题双模式练习</title>
    <style>
        :root {
            --primary: #2D593E;
            --secondary: #EBEDD4;
            --accent: #AE7645;
            --text-dark: #021502;
            --text-light: #975625;
            --bg-light: #F4F3EC;
            --white: #FFFFFF;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
            padding: 1.5rem 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-container {
            max-width: 1000px;
            width: 100%;
            background: var(--white);
            border-radius: 28px;
            padding: 2rem 1.8rem;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 1px;
            margin-bottom: 0.3rem;
        }

        .header-subtitle {
            font-size: 1.2rem;
            font-weight: 400;
            color: var(--text-light);
            background: var(--secondary);
            display: inline-block;
            padding: 0.3rem 1.8rem;
            border-radius: 30px;
            letter-spacing: 0.5px;
        }

        .mode-tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .mode-tab {
            padding: 10px 32px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-size: 1rem;
            transition: all 0.2s;
        }

        .mode-tab.active {
            background: var(--primary);
            color: white;
        }

        .mode-tab:hover {
            background: var(--primary);
            color: white;
        }

        .mode-panel {
            display: none;
        }

        .mode-panel.active {
            display: block;
        }

        .section-card {
            background: var(--white);
            border-radius: 20px;
            padding: 1.6rem 1.4rem;
            margin-bottom: 1.8rem;
            border: 1px solid rgba(45, 89, 62, 0.1);
            box-shadow: var(--shadow);
            transition: all 0.2s;
        }

        .section-title {
            color: var(--primary);
            font-size: 1.4rem;
            margin-bottom: 1.2rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 650;
        }

        .section-title-left {
            display: flex;
            align-items: center;
        }

        .section-title-left::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 24px;
            background: var(--accent);
            margin-right: 12px;
            border-radius: 6px;
        }

        .toggle-en-btn {
            padding: 4px 18px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-size: 0.85rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .toggle-en-btn:hover {
            background: var(--primary);
            color: white;
        }

        .toggle-en-btn.showing {
            background: var(--primary);
            color: white;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }

        th {
            background: var(--secondary);
            color: var(--primary);
            text-align: left;
            padding: 12px 10px;
            font-weight: 600;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        .zh-text {
            font-weight: 500;
            color: var(--text-dark);
        }

        .en-text {
            font-weight: 500;
            color: var(--primary);
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .en-hidden .en-text {
            display: none;
        }

        .control-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.2rem;
            margin: 1.8rem 0 1rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 1rem;
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
            transition: all 0.2s;
            letter-spacing: 0.4px;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #1e3d2a;
        }

        .btn-sm {
            padding: 6px 18px;
            font-size: 0.85rem;
        }

        .btn:disabled {
            opacity: 0.6;
            pointer-events: none;
        }

        .timer-box {
            background: var(--secondary);
            padding: 0.5rem 1.4rem;
            border-radius: 30px;
            font-weight: 700;
            color: var(--primary);
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .practice-item {
            background: #fafaf5;
            border-radius: 18px;
            padding: 1.4rem;
            margin-bottom: 1.2rem;
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        .practice-zh {
            font-weight: 700;
            margin-bottom: 0.8rem;
            color: var(--text-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .practice-tag {
            font-size: 0.7rem;
            background: var(--primary);
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
        }

        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #ddd;
            border-radius: 14px;
            font-family: 'Georgia', serif;
            font-size: 0.95rem;
            resize: vertical;
            min-height: 70px;
            background: white;
        }

        textarea:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(45, 89, 62, 0.08);
        }

        .feedback {
            margin-top: 0.6rem;
            font-size: 0.9rem;
            background: #f0f0f0;
            padding: 0.5rem 1rem;
            border-radius: 12px;
            display: none;
        }

        .answer-toggle-area {
            margin-top: 0.6rem;
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .answer-box {
            display: none;
            background: #e8f5e9;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            font-family: 'Georgia', serif;
            color: var(--primary);
            font-weight: 600;
            flex: 1;
            min-width: 200px;
        }

        .answer-box.visible {
            display: block;
        }

        .summary-container {
            margin-top: 2rem;
            background: var(--white);
            border-radius: 24px;
            padding: 1.8rem;
            border: 2px dashed var(--primary);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .summary-item {
            background: #f9f9f6;
            padding: 12px;
            border-radius: 14px;
        }

        .summary-zh {
            font-weight: 600;
            color: var(--text-dark);
        }

        .summary-user {
            color: #c62828;
            font-family: 'Georgia', serif;
        }

        .summary-correct {
            color: var(--primary);
            font-weight: 600;
            font-family: 'Georgia', serif;
        }

        .summary-item.is-correct .summary-user {
            color: #2e7d32;
        }

        .export-area {
            margin-top: 1.2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        @media (min-width: 768px) {
            .summary-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .hidden {
            display: none !important;
        }

        footer {
            margin-top: 2rem;
            color: var(--text-light);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="main-container" id="appRoot">
        <header>
            <h1 class="header-title">REBORN新生留学 雅思写作提分表达</h1>
            <p class="header-subtitle">地图题 · 词组与句型双模式练习</p>
        </header>

        <!-- 模式切换 -->
        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="phrase">📚 词组检查</button>
            <button class="mode-tab" data-mode="sentence">✍️ 句型检查</button>
        </div>

        <!-- ===================== 模式一：词组检查 ===================== -->
        <div id="phrasePanel" class="mode-panel active">
            <div id="phraseStudyMode">
                <div id="phraseTableSections"></div>
            </div>

            <div class="control-bar">
                <div id="phraseTimer" class="timer-box hidden">⏳ 05:00</div>
                <button id="phraseStartBtn" class="btn btn-primary">📋 开始检查</button>
                <button id="phraseSubmitBtn" class="btn btn-outline hidden">⏹️ 提前提交</button>
                <button id="phraseReshuffleBtn" class="btn btn-outline hidden">🔄 换一组</button>
                <button id="phraseRetryBtn" class="btn btn-outline hidden">🔁 再来一次</button>
            </div>

            <div id="phrasePracticeContainer" class="hidden"></div>

            <div id="phraseSummary" class="summary-container hidden">
                <h2 style="color:var(--primary); margin-bottom:1rem;">📸 检查结果对照</h2>
                <div id="phraseSummaryGrid" class="summary-grid"></div>
                <div class="export-area">
                    <button id="phraseExportBtn" class="btn btn-outline">📤 导出结果 (文本)</button>
                </div>
            </div>
        </div>

        <!-- ===================== 模式二：句型检查 ===================== -->
        <div id="sentencePanel" class="mode-panel">
            <div id="sentenceStudyMode">
                <div id="sentenceTableSections"></div>
            </div>

            <div class="control-bar">
                <button id="sentenceStartBtn" class="btn btn-primary">📋 开始句型练习</button>
                <button id="sentenceRetryBtn" class="btn btn-outline hidden">🔁 再来一次</button>
            </div>

            <div id="sentencePracticeContainer" class="hidden"></div>
        </div>

        <footer>© REBORN新生留学 · 地图题常用表达</footer>
    </div>

    <script>
        (function() {
            // ============================================================
            // 1. 数据：词表（词组检查用）
            // ============================================================
            const expressionData = {
                "基础方位表达": [
                    { zh: "坐落于", en: "be situated in" },
                    { zh: "位于", en: "be located in" },
                    { zh: "在……中心", en: "in the centre of" },
                    { zh: "在……角落", en: "in the corner of" },
                    { zh: "远离", en: "far away from" },
                    { zh: "在远处", en: "at a distance" },
                    { zh: "紧邻", en: "next to" },
                    { zh: "靠近", en: "close to" },
                    { zh: "与……相邻", en: "be adjacent to" },
                    { zh: "在……对面", en: "opposite to" },
                    { zh: "面对着", en: "face" },
                    { zh: "在……拐角处", en: "at the corner of" },
                    { zh: "在道路两侧", en: "on both sides of" },
                    { zh: "沿着……延伸", en: "extend along" },
                    { zh: "横跨……", en: "stretch across" }
                ],
                "常考地标词汇": [
                    { zh: "红绿灯", en: "traffic lights" },
                    { zh: "人行横道", en: "pedestrian crossing" },
                    { zh: "斑马线", en: "zebra crossing" },
                    { zh: "桥", en: "bridge" },
                    { zh: "立交桥", en: "flyover" },
                    { zh: "人行天桥", en: "overpass" },
                    { zh: "地下通道", en: "underpass" },
                    { zh: "环岛", en: "roundabout" },
                    { zh: "十字路口", en: "crossroads" },
                    { zh: "丁字路口", en: "T-junction" },
                    { zh: "主干道", en: "main road" },
                    { zh: "支路", en: "side road" },
                    { zh: "高速公路", en: "highway" },
                    { zh: "停车场", en: "car park" },
                    { zh: "公交站", en: "bus stop" },
                    { zh: "火车站", en: "railway station" },
                    { zh: "河流", en: "river" },
                    { zh: "湖泊", en: "lake" },
                    { zh: "绿地", en: "green space" },
                    { zh: "公园", en: "park" },
                    { zh: "农田", en: "farmland" },
                    { zh: "空地", en: "open space" },
                    { zh: "住宅区", en: "residential area" },
                    { zh: "商业区", en: "commercial area" },
                    { zh: "工业区", en: "industrial area" },
                    { zh: "办公楼", en: "office building" },
                    { zh: "购物中心", en: "shopping centre" }
                ],
                "新增类表达": [
                    { zh: "新建", en: "be newly built" },
                    { zh: "修建", en: "be constructed" },
                    { zh: "建造", en: "be erected" },
                    { zh: "铺设道路", en: "lay out roads" },
                    { zh: "拓宽道路", en: "widen the road" },
                    { zh: "拉直道路", en: "straighten the road" },
                    { zh: "修建桥梁", en: "build a bridge" },
                    { zh: "增设环岛", en: "construct a roundabout" },
                    { zh: "加设人行横道", en: "add a pedestrian crossing" }
                ],
                "拆除消失类表达": [
                    { zh: "拆除", en: "be demolished" },
                    { zh: "移除", en: "be removed" },
                    { zh: "完全消失", en: "disappear completely" },
                    { zh: "夷为平地", en: "be flattened" },
                    { zh: "填平河流", en: "fill in the river" }
                ],
                "改造转换类表达": [
                    { zh: "改造为", en: "be transformed into" },
                    { zh: "重新改建", en: "be reconstructed" },
                    { zh: "翻新整修", en: "be renovated" },
                    { zh: "重新规划", en: "be re-planned" },
                    { zh: "用途改变", en: "change the original function" },
                    { zh: "把……改造成", en: "convert...into" },
                    { zh: "道路改道", en: "reroute the road" }
                ],
                "面积范围变化类表达": [
                    { zh: "面积扩大", en: "expand in size" },
                    { zh: "范围延伸", en: "extend to" },
                    { zh: "面积缩小", en: "shrink in area" },
                    { zh: "占地", en: "cover an area of" },
                    { zh: "绿地缩减", en: "the green space declines" }
                ],
                "整体描述衔接表达": [
                    { zh: "整体布局发生巨变", en: "the overall layout changed dramatically" },
                    { zh: "最显著的变化是...", en: "the most noticeable change is that" },
                    { zh: "诸多设施经历巨大改造", en: "many facilities have undergone dramatic changes" },
                    { zh: "区域功能重新划分", en: "the function of areas was redivided" },
                    { zh: "整体来看", en: "overall, it is clear that" },
                    { zh: "对比两幅地图", en: "by comparing the two maps" },
                    { zh: "在前期地图中", en: "in the first map" },
                    { zh: "到后期阶段", en: "by the later period" }
                ]
            };

            // 扁平化所有词组
            const allPhrases = [];
            for (let [category, items] of Object.entries(expressionData)) {
                items.forEach(item => allPhrases.push({ ...item, category }));
            }

            // ============================================================
            // 2. 数据：句型（句型检查用）
            // ============================================================
            const sentencePool = [
                { zh: "学校坐落于城市中心，紧邻一个大型公园。", en: "The school is situated in the city centre, next to a large park.",
                    category: "方位描述" },
                { zh: "公交站位于火车站的对面，靠近主干道。", en: "The bus stop is located opposite the railway station, close to the main road.",
                    category: "方位描述" },
                { zh: "一条河流沿着小镇的东部边界延伸，横跨整个区域。", en: "A river extends along the eastern boundary of the town and stretches across the whole area.",
                    category: "方位描述" },
                { zh: "2010年，政府在河上修建了一座新桥。", en: "In 2010, the government built a new bridge over the river.",
                    category: "新增" },
                { zh: "在道路两侧新建了一排办公楼。", en: "A row of office buildings was newly built on both sides of the road.",
                    category: "新增" },
                { zh: "环岛被增设于十字路口，以缓解交通压力。", en: "A roundabout was constructed at the crossroads to ease traffic pressure.",
                    category: "新增" },
                { zh: "原有的工厂于2005年被拆除，取而代之的是一片绿地。", en: "The old factory was demolished in 2005 and replaced by a green space.",
                    category: "拆除" },
                { zh: "位于城镇南部的旧火车站已被移除，变成了一个购物中心。", en: "The old railway station, which was located in the south of the town, has been removed and turned into a shopping centre.",
                    category: "拆除" },
                { zh: "这块农田被改造成一个大型住宅区。", en: "This farmland was transformed into a large residential area.",
                    category: "改造" },
                { zh: "公园的面积扩大了将近一倍，重新规划了休闲区域。", en: "The park has expanded in size by nearly twice and the leisure areas have been re-planned.",
                    category: "改造" },
                { zh: "对比两幅地图可以看出，整体布局发生了巨变，诸多设施经历了巨大改造。", en: "By comparing the two maps, it can be seen that the overall layout changed dramatically, and many facilities have undergone dramatic changes.",
                    category: "整体变化" },
                { zh: "最显著的变化是，丁字路口被拉直并拓宽，同时加设了人行横道。", en: "The most noticeable change is that the T-junction was straightened and widened, and a pedestrian crossing was added.",
                    category: "整体变化" }
            ];

            // ============================================================
            // 3. DOM 引用 - 词组模式
            // ============================================================
            const phraseStudyMode = document.getElementById('phraseStudyMode');
            const phraseTableSections = document.getElementById('phraseTableSections');
            const phrasePracticeContainer = document.getElementById('phrasePracticeContainer');
            const phraseSummary = document.getElementById('phraseSummary');
            const phraseSummaryGrid = document.getElementById('phraseSummaryGrid');
            const phraseTimer = document.getElementById('phraseTimer');
            const phraseStartBtn = document.getElementById('phraseStartBtn');
            const phraseSubmitBtn = document.getElementById('phraseSubmitBtn');
            const phraseReshuffleBtn = document.getElementById('phraseReshuffleBtn');
            const phraseRetryBtn = document.getElementById('phraseRetryBtn');
            const phraseExportBtn = document.getElementById('phraseExportBtn');

            let phraseQuestions = [];
            let phraseTimerInterval = null;
            let phraseTimeLeft = 300;
            let phraseActive = false;

            // ============================================================
            // 4. DOM 引用 - 句型模式
            // ============================================================
            const sentenceStudyMode = document.getElementById('sentenceStudyMode');
            const sentenceTableSections = document.getElementById('sentenceTableSections');
            const sentencePracticeContainer = document.getElementById('sentencePracticeContainer');
            const sentenceStartBtn = document.getElementById('sentenceStartBtn');
            const sentenceRetryBtn = document.getElementById('sentenceRetryBtn');

            let sentenceActive = false;

            // 存储每个面板的显示状态
            let phraseEnVisible = false;
            let sentenceEnVisible = false;

            // ============================================================
            // 5. 渲染函数 - 词组静态表格（带显示/隐藏英文按钮）
            // ============================================================
            function renderPhraseTables() {
                let html = '';
                for (let [title, items] of Object.entries(expressionData)) {
                    html += `
                        <div class="section-card">
                            <div class="section-title">
                                <span class="section-title-left">${title}</span>
                                <button class="toggle-en-btn" data-panel="phrase" data-category="${title}">👁️ 显示英文</button>
                            </div>
                            <div class="table-container">
                                <table class="phrase-table en-hidden" data-category="${title}">
                                    <thead><tr><th>中文表达</th><th>英文表达</th></tr></thead>
                                    <tbody>
                                        ${items.map(i => `<tr><td class="zh-text">${i.zh}</td><td class="en-text">${i.en}</td></tr>`).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                }
                phraseTableSections.innerHTML = html;

                // 绑定词组面板的切换按钮
                document.querySelectorAll('#phraseTableSections .toggle-en-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const category = this.getAttribute('data-category');
                        const table = document.querySelector(`#phraseTableSections .phrase-table[data-category="${category}"]`);
                        if (table) {
                            table.classList.toggle('en-hidden');
                            const isHidden = table.classList.contains('en-hidden');
                            this.textContent = isHidden ? '👁️ 显示英文' : '🙈 隐藏英文';
                            this.classList.toggle('showing', !isHidden);
                        }
                    });
                });
            }

            // ============================================================
            // 6. 渲染函数 - 句型静态表格（直接显示汉英对照句型）
            // ============================================================
            function renderSentenceTables() {
                // 直接使用 sentencePool 生成汉英对照表
                let html = `
                    <div class="section-card">
                        <div class="section-title">
                            <span class="section-title-left">📝 汉英对照句型</span>
                            <button class="toggle-en-btn" id="sentenceTableToggle">👁️ 显示英文</button>
                        </div>
                        <div class="table-container">
                            <table id="sentenceTable" class="en-hidden">
                                <thead><tr><th>中文句子</th><th>英文翻译</th></tr></thead>
                                <tbody>
                                    ${sentencePool.map((s, idx) => `
                                        <tr>
                                            <td class="zh-text">${idx+1}. ${s.zh}</td>
                                            <td class="en-text">${s.en}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                sentenceTableSections.innerHTML = html;

                // 绑定句型面板的切换按钮
                const toggleBtn = document.getElementById('sentenceTableToggle');
                const table = document.getElementById('sentenceTable');
                if (toggleBtn && table) {
                    toggleBtn.addEventListener('click', function() {
                        table.classList.toggle('en-hidden');
                        const isHidden = table.classList.contains('en-hidden');
                        this.textContent = isHidden ? '👁️ 显示英文' : '🙈 隐藏英文';
                        this.classList.toggle('showing', !isHidden);
                    });
                }
            }

            // ============================================================
            // 7. 词组模式逻辑
            // ============================================================
            function selectPhraseQuestions(count = 20) {
                const shuffled = [...allPhrases].sort(() => 0.5 - Math.random());
                return shuffled.slice(0, Math.min(count, allPhrases.length));
            }

            function renderPhrasePractice() {
                phrasePracticeContainer.innerHTML = '';
                if (!phraseQuestions.length) return;
                phraseQuestions.forEach((q, idx) => {
                    const div = document.createElement('div');
                    div.className = 'practice-item';
                    div.innerHTML = `
                        <div class="practice-zh">
                            <span>${idx + 1}. ${q.zh}</span>
                            <span class="practice-tag">${q.category}</span>
                        </div>
                        <textarea id="phraseQ-${idx}" placeholder="请输入对应的英文表达..."></textarea>
                        <div id="phraseFeedback-${idx}" class="feedback"></div>
                    `;
                    phrasePracticeContainer.appendChild(div);
                });
            }

            function stopPhraseTimer() {
                if (phraseTimerInterval) {
                    clearInterval(phraseTimerInterval);
                    phraseTimerInterval = null;
                }
            }

            function startPhraseTimer() {
                stopPhraseTimer();
                phraseTimeLeft = 300;
                updatePhraseTimerDisplay();
                phraseTimer.classList.remove('hidden');
                phraseTimerInterval = setInterval(() => {
                    phraseTimeLeft--;
                    updatePhraseTimerDisplay();
                    if (phraseTimeLeft <= 0) {
                        stopPhraseTimer();
                        submitPhraseCheck();
                    }
                }, 1000);
            }

            function updatePhraseTimerDisplay() {
                const mins = Math.floor(phraseTimeLeft / 60);
                const secs = phraseTimeLeft % 60;
                phraseTimer.textContent = `⏳ ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }

            function enterPhraseMode() {
                phraseStudyMode.classList.add('hidden');
                phrasePracticeContainer.classList.remove('hidden');
                phraseSummary.classList.add('hidden');
                phraseQuestions = selectPhraseQuestions(20);
                renderPhrasePractice();
                startPhraseTimer();
                phraseActive = true;
                phraseStartBtn.classList.add('hidden');
                phraseSubmitBtn.classList.remove('hidden');
                phraseReshuffleBtn.classList.remove('hidden');
                phraseRetryBtn.classList.remove('hidden');
                phraseTimer.classList.remove('hidden');
            }

            function submitPhraseCheck() {
                if (!phraseActive) return;
                stopPhraseTimer();
                phraseActive = false;
                phraseSummaryGrid.innerHTML = '';
                phraseQuestions.forEach((q, idx) => {
                    const textarea = document.getElementById(`phraseQ-${idx}`);
                    const userAnswer = textarea ? textarea.value.trim() : '';
                    const feedbackDiv = document.getElementById(`phraseFeedback-${idx}`);
                    if (feedbackDiv) {
                        feedbackDiv.style.display = 'block';
                        feedbackDiv.innerHTML = `✓ 正确答案：<strong style="color:var(--primary);">${q.en}</strong>`;
                    }
                    const isCorrect = userAnswer.toLowerCase() === q.en.toLowerCase();
                    const itemDiv = document.createElement('div');
                    itemDiv.className = `summary-item ${isCorrect ? 'is-correct' : ''}`;
                    itemDiv.innerHTML = `
                        <div class="summary-zh">${idx+1}. ${q.zh}</div>
                        <div class="summary-user">你的答案：${userAnswer || '(未填写)'}</div>
                        <div class="summary-correct">正确：${q.en}</div>
                    `;
                    phraseSummaryGrid.appendChild(itemDiv);
                });
                phraseSummary.classList.remove('hidden');
                phraseSubmitBtn.classList.add('hidden');
                phraseReshuffleBtn.classList.add('hidden');
                phraseTimer.classList.add('hidden');
                phraseRetryBtn.classList.remove('hidden');
                document.querySelectorAll('#phrasePracticeContainer textarea').forEach(ta => ta.disabled = true);
            }

            function resetPhrase() {
                stopPhraseTimer();
                phraseActive = false;
                phraseStudyMode.classList.remove('hidden');
                phrasePracticeContainer.classList.add('hidden');
                phraseSummary.classList.add('hidden');
                phraseStartBtn.classList.remove('hidden');
                phraseSubmitBtn.classList.add('hidden');
                phraseReshuffleBtn.classList.add('hidden');
                phraseRetryBtn.classList.add('hidden');
                phraseTimer.classList.add('hidden');
                phraseQuestions = [];
                phrasePracticeContainer.innerHTML = '';
                phraseSummaryGrid.innerHTML = '';
            }

            function reshufflePhrase() {
                if (!phraseActive) return;
                stopPhraseTimer();
                phraseQuestions = selectPhraseQuestions(20);
                renderPhrasePractice();
                phraseSummary.classList.add('hidden');
                document.querySelectorAll('#phrasePracticeContainer textarea').forEach(ta => ta.disabled = false);
                startPhraseTimer();
                phraseActive = true;
                phraseSubmitBtn.classList.remove('hidden');
                phraseReshuffleBtn.classList.remove('hidden');
                phraseRetryBtn.classList.remove('hidden');
            }

            function exportPhraseResults() {
                if (!phraseQuestions.length) return;
                let text = "REBORN 雅思写作表达检查结果 (地图题·词组)\n================================\n";
                phraseQuestions.forEach((q, idx) => {
                    const textarea = document.getElementById(`phraseQ-${idx}`);
                    const userAns = textarea ? textarea.value.trim() : '';
                    text += `${idx+1}. ${q.zh}\n`;
                    text += `   你的答案: ${userAns || '未填写'}\n`;
                    text += `   正确答案: ${q.en}\n\n`;
                });
                const blob = new Blob([text], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'map_phrases_result.txt';
                a.click();
                URL.revokeObjectURL(url);
            }

            // ============================================================
            // 8. 句型模式逻辑
            // ============================================================
            function renderSentencePractice() {
                sentencePracticeContainer.innerHTML = '';
                sentencePool.forEach((q, idx) => {
                    const div = document.createElement('div');
                    div.className = 'practice-item';
                    div.innerHTML = `
                        <div class="practice-zh">
                            <span>${idx + 1}. ${q.zh}</span>
                            <span class="practice-tag">${q.category}</span>
                        </div>
                        <textarea id="sentenceQ-${idx}" placeholder="请输入对应的英文翻译..." style="min-height:80px;"></textarea>
                        <div class="answer-toggle-area">
                            <button class="btn btn-outline btn-sm toggle-answer-btn" data-idx="${idx}">👁️ 查看答案</button>
                            <div id="sentenceAnswer-${idx}" class="answer-box">${q.en}</div>
                        </div>
                    `;
                    sentencePracticeContainer.appendChild(div);
                });

                // 绑定所有 toggle 按钮
                document.querySelectorAll('.toggle-answer-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = this.getAttribute('data-idx');
                        const answerBox = document.getElementById(`sentenceAnswer-${idx}`);
                        if (answerBox.classList.contains('visible')) {
                            answerBox.classList.remove('visible');
                            this.textContent = '👁️ 查看答案';
                        } else {
                            answerBox.classList.add('visible');
                            this.textContent = '🙈 隐藏答案';
                        }
                    });
                });
            }

            function enterSentenceMode() {
                sentenceStudyMode.classList.add('hidden');
                sentencePracticeContainer.classList.remove('hidden');
                renderSentencePractice();
                sentenceActive = true;
                sentenceStartBtn.classList.add('hidden');
                sentenceRetryBtn.classList.remove('hidden');
            }

            function resetSentence() {
                sentenceActive = false;
                sentenceStudyMode.classList.remove('hidden');
                sentencePracticeContainer.classList.add('hidden');
                sentenceStartBtn.classList.remove('hidden');
                sentenceRetryBtn.classList.add('hidden');
                sentencePracticeContainer.innerHTML = '';
            }

            // ============================================================
            // 9. 模式切换（Tab 切换）
            // ============================================================
            const modeTabs = document.querySelectorAll('.mode-tab');
            const phrasePanel = document.getElementById('phrasePanel');
            const sentencePanel = document.getElementById('sentencePanel');

            modeTabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    modeTabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    const mode = this.getAttribute('data-mode');
                    if (mode === 'phrase') {
                        phrasePanel.classList.add('active');
                        sentencePanel.classList.remove('active');
                    } else {
                        sentencePanel.classList.add('active');
                        phrasePanel.classList.remove('active');
                    }
                });
            });

            // ============================================================
            // 10. 事件绑定
            // ============================================================
            phraseStartBtn.addEventListener('click', enterPhraseMode);
            phraseSubmitBtn.addEventListener('click', () => { if (phraseActive) { stopPhraseTimer();
                    submitPhraseCheck(); } });
            phraseReshuffleBtn.addEventListener('click', reshufflePhrase);
            phraseRetryBtn.addEventListener('click', resetPhrase);
            phraseExportBtn.addEventListener('click', exportPhraseResults);

            sentenceStartBtn.addEventListener('click', enterSentenceMode);
            sentenceRetryBtn.addEventListener('click', resetSentence);

            // ============================================================
            // 11. 初始化
            // ============================================================
            renderPhraseTables();
            renderSentenceTables();
        })();
    </script>
</body>
</html>
