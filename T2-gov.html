<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>REBORN新生留学 · 政府与公共政策类双模式练习</title>
    <style>
        :root {
            --primary: #2D593E;
            --secondary: #EBEDD4;
            --accent: #AE7645;
            --text-dark: #021502;
            --text-light: #975625;
            --bg-light: #F4F3EC;
            --white: #FFFFFF;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
            padding: 1.5rem 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-container {
            max-width: 1000px;
            width: 100%;
            background: var(--white);
            border-radius: 28px;
            padding: 2rem 1.8rem;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 1px;
            margin-bottom: 0.3rem;
        }

        .header-subtitle {
            font-size: 1.2rem;
            font-weight: 400;
            color: var(--text-light);
            background: var(--secondary);
            display: inline-block;
            padding: 0.3rem 1.8rem;
            border-radius: 30px;
            letter-spacing: 0.5px;
        }

        .mode-tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .mode-tab {
            padding: 10px 32px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-size: 1rem;
            transition: all 0.2s;
        }

        .mode-tab.active {
            background: var(--primary);
            color: white;
        }

        .mode-tab:hover {
            background: var(--primary);
            color: white;
        }

        .mode-panel {
            display: none;
        }

        .mode-panel.active {
            display: block;
        }

        .section-card {
            background: var(--white);
            border-radius: 20px;
            padding: 1.6rem 1.4rem;
            margin-bottom: 1.8rem;
            border: 1px solid rgba(45, 89, 62, 0.1);
            box-shadow: var(--shadow);
            transition: all 0.2s;
        }

        .section-title {
            color: var(--primary);
            font-size: 1.4rem;
            margin-bottom: 1.2rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 650;
        }

        .section-title-left {
            display: flex;
            align-items: center;
        }

        .section-title-left::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 24px;
            background: var(--accent);
            margin-right: 12px;
            border-radius: 6px;
        }

        .toggle-en-btn {
            padding: 4px 18px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-size: 0.85rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .toggle-en-btn:hover {
            background: var(--primary);
            color: white;
        }

        .toggle-en-btn.showing {
            background: var(--primary);
            color: white;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }

        th {
            background: var(--secondary);
            color: var(--primary);
            text-align: left;
            padding: 12px 10px;
            font-weight: 600;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        .zh-text {
            font-weight: 500;
            color: var(--text-dark);
        }

        .en-text {
            font-weight: 500;
            color: var(--primary);
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .en-hidden .en-text {
            display: none;
        }

        .control-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.2rem;
            margin: 1.8rem 0 1rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 1rem;
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
            transition: all 0.2s;
            letter-spacing: 0.4px;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #1e3d2a;
        }

        .btn-sm {
            padding: 6px 18px;
            font-size: 0.85rem;
        }

        .btn:disabled {
            opacity: 0.6;
            pointer-events: none;
        }

        .timer-box {
            background: var(--secondary);
            padding: 0.5rem 1.4rem;
            border-radius: 30px;
            font-weight: 700;
            color: var(--primary);
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .practice-item {
            background: #fafaf5;
            border-radius: 18px;
            padding: 1.4rem;
            margin-bottom: 1.2rem;
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        .practice-zh {
            font-weight: 700;
            margin-bottom: 0.8rem;
            color: var(--text-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .practice-tag {
            font-size: 0.7rem;
            background: var(--primary);
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
        }

        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #ddd;
            border-radius: 14px;
            font-family: 'Georgia', serif;
            font-size: 0.95rem;
            resize: vertical;
            min-height: 70px;
            background: white;
        }

        textarea:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(45, 89, 62, 0.08);
        }

        .feedback {
            margin-top: 0.6rem;
            font-size: 0.9rem;
            background: #f0f0f0;
            padding: 0.5rem 1rem;
            border-radius: 12px;
            display: none;
        }

        .answer-toggle-area {
            margin-top: 0.6rem;
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .answer-box {
            display: none;
            background: #e8f5e9;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            font-family: 'Georgia', serif;
            color: var(--primary);
            font-weight: 600;
            flex: 1;
            min-width: 200px;
        }

        .answer-box.visible {
            display: block;
        }

        .summary-container {
            margin-top: 2rem;
            background: var(--white);
            border-radius: 24px;
            padding: 1.8rem;
            border: 2px dashed var(--primary);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .summary-item {
            background: #f9f9f6;
            padding: 12px;
            border-radius: 14px;
        }

        .summary-zh {
            font-weight: 600;
            color: var(--text-dark);
        }

        .summary-user {
            color: #c62828;
            font-family: 'Georgia', serif;
        }

        .summary-correct {
            color: var(--primary);
            font-weight: 600;
            font-family: 'Georgia', serif;
        }

        .summary-item.is-correct .summary-user {
            color: #2e7d32;
        }

        .export-area {
            margin-top: 1.2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        @media (min-width: 768px) {
            .summary-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .hidden {
            display: none !important;
        }

        footer {
            margin-top: 2rem;
            color: var(--text-light);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="main-container" id="appRoot">
        <header>
            <h1 class="header-title">REBORN新生留学 雅思写作提分表达</h1>
            <p class="header-subtitle">政府与公共政策 · 词组与句型双模式练习</p>
        </header>

        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="phrase">📚 词组检查</button>
            <button class="mode-tab" data-mode="sentence">✍️ 句型检查</button>
        </div>

        <!-- 词组检查 -->
        <div id="phrasePanel" class="mode-panel active">
            <div id="phraseStudyMode">
                <div id="phraseTableSections"></div>
            </div>
            <div class="control-bar">
                <div id="phraseTimer" class="timer-box hidden">⏳ 05:00</div>
                <button id="phraseStartBtn" class="btn btn-primary">📋 开始检查</button>
                <button id="phraseSubmitBtn" class="btn btn-outline hidden">⏹️ 提前提交</button>
                <button id="phraseReshuffleBtn" class="btn btn-outline hidden">🔄 换一组</button>
                <button id="phraseRetryBtn" class="btn btn-outline hidden">🔁 再来一次</button>
            </div>
            <div id="phrasePracticeContainer" class="hidden"></div>
            <div id="phraseSummary" class="summary-container hidden">
                <h2 style="color:var(--primary); margin-bottom:1rem;">📸 检查结果对照</h2>
                <div id="phraseSummaryGrid" class="summary-grid"></div>
                <div class="export-area">
                    <button id="phraseExportBtn" class="btn btn-outline">📤 导出结果 (文本)</button>
                </div>
            </div>
        </div>

        <!-- 句型检查 -->
        <div id="sentencePanel" class="mode-panel">
            <div id="sentenceStudyMode">
                <div id="sentenceTableSections"></div>
            </div>
            <div class="control-bar">
                <button id="sentenceStartBtn" class="btn btn-primary">📋 开始句型练习</button>
                <button id="sentenceRetryBtn" class="btn btn-outline hidden">🔁 再来一次</button>
            </div>
            <div id="sentencePracticeContainer" class="hidden"></div>
        </div>

        <footer>© REBORN新生留学 · 政府与公共政策类写作表达</footer>
    </div>

    <script>
        (function() {
            // ============================================================
            // 1. 词组数据（直接从原HTML提取）
            // ============================================================
            const expressionData = {
                "政府财政支出分配": [
                    { zh: "政府财政预算", en: "government budget" },
                    { zh: "公共服务", en: "public services" },
                    { zh: "医疗保障", en: "medical care and healthcare" },
                    { zh: "教育投入", en: "education investment" },
                    { zh: "国防建设", en: "national defence" },
                    { zh: "艺术体育发展", en: "art and sports development" },
                    { zh: "合理分配资金", en: "allocate funds reasonably" },
                    { zh: "优先民生需求", en: "prioritise people's livelihood" },
                    { zh: "完善公共福利", en: "improve public welfare" },
                    { zh: "扶持弱势人群", en: "support disadvantaged groups" }
                ],
                "公共设施建设": [
                    { zh: "城市公园", en: "urban parks" },
                    { zh: "图书馆博物馆", en: "libraries and museums" },
                    { zh: "体育场馆", en: "sports stadiums" },
                    { zh: "便民设施", en: "convenient public facilities" },
                    { zh: "丰富市民生活", en: "enrich citizens' life" },
                    { zh: "提升城市形象", en: "improve urban image" },
                    { zh: "完善基础设施", en: "improve infrastructure" },
                    { zh: "免费向公众开放", en: "open to the public for free" },
                    { zh: "休闲娱乐配套", en: "leisure and entertainment facilities" },
                    { zh: "改善居住环境", en: "improve living environment" }
                ],
                "法律与社会规则": [
                    { zh: "法律法规", en: "laws and regulations" },
                    { zh: "社会秩序", en: "social order" },
                    { zh: "约束不良行为", en: "restrict bad behaviour" },
                    { zh: "提高守法意识", en: "raise awareness of abiding by laws" },
                    { zh: "严格执法", en: "strict law enforcement" },
                    { zh: "规范社会风气", en: "regulate social conduct" },
                    { zh: "保障公共安全", en: "guarantee public safety" },
                    { zh: "禁烟禁塑规定", en: "smoking and plastic bans" },
                    { zh: "交通法规", en: "traffic regulations" },
                    { zh: "惩罚违法行为", en: "punish illegal behaviour" }
                ],
                "国际援助与全球贫富": [
                    { zh: "国际援助", en: "international aid" },
                    { zh: "贫富差距", en: "wealth gap" },
                    { zh: "经济落后地区", en: "economically underdeveloped areas" },
                    { zh: "基础建设", en: "infrastructure construction" },
                    { zh: "缓解贫困", en: "alleviate poverty" },
                    { zh: "促进全球发展", en: "promote global development" },
                    { zh: "避免资源浪费", en: "avoid waste of resources" },
                    { zh: "人道主义援助", en: "humanitarian aid" },
                    { zh: "缩小南北差距", en: "narrow the north-south gap" },
                    { zh: "自主发展能力", en: "self-development capability" }
                ],
                "社会福利与养老保障": [
                    { zh: "社会保障体系", en: "social security system" },
                    { zh: "养老金制度", en: "pension system" },
                    { zh: "失业救济", en: "unemployment benefits" },
                    { zh: "免费医疗", en: "free medical treatment" },
                    { zh: "义务教育", en: "compulsory education" },
                    { zh: "缩小阶层差距", en: "narrow the class gap" },
                    { zh: "平衡社会资源", en: "balance social resources" },
                    { zh: "降低生活压力", en: "reduce living pressure" }
                ]
            };

            const allPhrases = [];
            for (let [category, items] of Object.entries(expressionData)) {
                items.forEach(item => allPhrases.push({ ...item, category }));
            }

            // ============================================================
            // 2. 句型数据（12句）
            // ============================================================
            const sentencePool = [
                { zh: "政府应当合理分配财政预算，优先满足民生需求，特别是医疗保障和教育投入。",
                    en: "The government should allocate its budget reasonably, prioritising people's livelihood needs, especially medical care and education investment.",
                    category: "政府财政支出分配" },
                { zh: "完善公共福利并扶持弱势人群，是缩小社会贫富差距的重要途径。",
                    en: "Improving public welfare and supporting disadvantaged groups are important ways to narrow the wealth gap in society.",
                    category: "政府财政支出分配" },
                { zh: "政府在艺术体育发展方面的投入虽然不如国防建设那样受到关注，但对社会文化繁荣同样至关重要。",
                    en: "Although government investment in art and sports development receives less attention than national defence, it is equally crucial for social and cultural prosperity.",
                    category: "政府财政支出分配" },
                { zh: "城市公园、图书馆博物馆和体育场馆等公共设施，能够丰富市民生活、提升城市形象。",
                    en: "Public facilities such as urban parks, libraries, museums and sports stadiums can enrich citizens' lives and improve the urban image.",
                    category: "公共设施建设" },
                { zh: "政府应当完善基础设施，修建更多便民设施和休闲娱乐配套，从而改善居民的居住环境。",
                    en: "The government should improve infrastructure and build more convenient public facilities and leisure facilities, thereby improving residents' living environment.",
                    category: "公共设施建设" },
                { zh: "免费向公众开放的公共设施有助于促进社会公平，让所有市民都能享受城市发展的成果。",
                    en: "Public facilities that are open to the public for free help promote social equity, allowing all citizens to enjoy the benefits of urban development.",
                    category: "公共设施建设" },
                { zh: "法律法规和交通法规对于约束不良行为、保障公共安全至关重要。",
                    en: "Laws, regulations and traffic regulations are crucial for restricting bad behaviour and guaranteeing public safety.",
                    category: "法律与社会规则" },
                { zh: "严格执法和惩罚违法行为能够有效规范社会风气，提高公民的守法意识。",
                    en: "Strict law enforcement and punishment of illegal behaviour can effectively regulate social conduct and raise citizens' awareness of abiding by laws.",
                    category: "法律与社会规则" },
                { zh: "禁烟禁塑规定虽然给部分市民带来不便，但有助于改善公共健康和环境质量。",
                    en: "Although smoking and plastic bans cause inconvenience to some citizens, they help improve public health and environmental quality.",
                    category: "法律与社会规则" },
                { zh: "国际援助不仅能够缓解贫困、促进全球发展，还能帮助经济落后地区加强基础建设。",
                    en: "International aid can not only alleviate poverty and promote global development, but also help economically underdeveloped areas strengthen infrastructure construction.",
                    category: "国际援助与全球贫富" },
                { zh: "人道主义援助应当注重培养受援国的自主发展能力，避免资源浪费。",
                    en: "Humanitarian aid should focus on cultivating the self-development capability of recipient countries and avoid waste of resources.",
                    category: "国际援助与全球贫富" },
                { zh: "通过完善社会保障体系和养老金制度，政府可以有效降低民众的生活压力。",
                    en: "By improving the social security system and the pension system, the government can effectively reduce people's living pressure.",
                    category: "社会福利与养老保障" }
            ];

            // ============================================================
            // 3. DOM - 词组模式
            // ============================================================
            const phraseStudyMode = document.getElementById('phraseStudyMode');
            const phraseTableSections = document.getElementById('phraseTableSections');
            const phrasePracticeContainer = document.getElementById('phrasePracticeContainer');
            const phraseSummary = document.getElementById('phraseSummary');
            const phraseSummaryGrid = document.getElementById('phraseSummaryGrid');
            const phraseTimer = document.getElementById('phraseTimer');
            const phraseStartBtn = document.getElementById('phraseStartBtn');
            const phraseSubmitBtn = document.getElementById('phraseSubmitBtn');
            const phraseReshuffleBtn = document.getElementById('phraseReshuffleBtn');
            const phraseRetryBtn = document.getElementById('phraseRetryBtn');
            const phraseExportBtn = document.getElementById('phraseExportBtn');

            let phraseQuestions = [];
            let phraseTimerInterval = null;
            let phraseTimeLeft = 300;
            let phraseActive = false;

            // ============================================================
            // 4. DOM - 句型模式
            // ============================================================
            const sentenceStudyMode = document.getElementById('sentenceStudyMode');
            const sentenceTableSections = document.getElementById('sentenceTableSections');
            const sentencePracticeContainer = document.getElementById('sentencePracticeContainer');
            const sentenceStartBtn = document.getElementById('sentenceStartBtn');
            const sentenceRetryBtn = document.getElementById('sentenceRetryBtn');

            // ============================================================
            // 5. 渲染函数 - 词组
            // ============================================================
            function renderPhraseTables() {
                let html = '';
                for (let [title, items] of Object.entries(expressionData)) {
                    html += `
                        <div class="section-card">
                            <div class="section-title">
                                <span class="section-title-left">${title}</span>
                                <button class="toggle-en-btn" data-panel="phrase" data-category="${title}">👁️ 显示英文</button>
                            </div>
                            <div class="table-container">
                                <table class="phrase-table en-hidden" data-category="${title}">
                                    <thead><tr><th>中文表达</th><th>英文表达</th></tr></thead>
                                    <tbody>
                                        ${items.map(i => `<tr><td class="zh-text">${i.zh}</td><td class="en-text">${i.en}</td></tr>`).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                }
                phraseTableSections.innerHTML = html;

                document.querySelectorAll('#phraseTableSections .toggle-en-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const category = this.getAttribute('data-category');
                        const table = document.querySelector(
                            `#phraseTableSections .phrase-table[data-category="${category}"]`);
                        if (table) {
                            table.classList.toggle('en-hidden');
                            const isHidden = table.classList.contains('en-hidden');
                            this.textContent = isHidden ? '👁️ 显示英文' : '🙈 隐藏英文';
                            this.classList.toggle('showing', !isHidden);
                        }
                    });
                });
            }

            // ============================================================
            // 6. 渲染函数 - 句型
            // ============================================================
            function renderSentenceTables() {
                let html = `
                    <div class="section-card">
                        <div class="section-title">
                            <span class="section-title-left">📝 汉英对照句型</span>
                            <button class="toggle-en-btn" id="sentenceTableToggle">👁️ 显示英文</button>
                        </div>
                        <div class="table-container">
                            <table id="sentenceTable" class="en-hidden">
                                <thead><tr><th>中文句子</th><th>英文翻译</th></tr></thead>
                                <tbody>
                                    ${sentencePool.map((s, idx) => `
                                        <tr>
                                            <td class="zh-text">${idx+1}. ${s.zh}</td>
                                            <td class="en-text">${s.en}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                sentenceTableSections.innerHTML = html;

                const toggleBtn = document.getElementById('sentenceTableToggle');
                const table = document.getElementById('sentenceTable');
                if (toggleBtn && table) {
                    toggleBtn.addEventListener('click', function() {
                        table.classList.toggle('en-hidden');
                        const isHidden = table.classList.contains('en-hidden');
                        this.textContent = isHidden ? '👁️ 显示英文' : '🙈 隐藏英文';
                        this.classList.toggle('showing', !isHidden);
                    });
                }
            }

            // ============================================================
            // 7. 词组逻辑
            // ============================================================
            function selectPhraseQuestions(count = 20) {
                const shuffled = [...allPhrases].sort(() => 0.5 - Math.random());
                return shuffled.slice(0, Math.min(count, allPhrases.length));
            }

            function renderPhrasePractice() {
                phrasePracticeContainer.innerHTML = '';
                if (!phraseQuestions.length) return;
                phraseQuestions.forEach((q, idx) => {
                    const div = document.createElement('div');
                    div.className = 'practice-item';
                    div.innerHTML = `
                        <div class="practice-zh">
                            <span>${idx + 1}. ${q.zh}</span>
                            <span class="practice-tag">${q.category}</span>
                        </div>
                        <textarea id="phraseQ-${idx}" placeholder="请输入对应的英文表达..."></textarea>
                        <div id="phraseFeedback-${idx}" class="feedback"></div>
                    `;
                    phrasePracticeContainer.appendChild(div);
                });
            }

            function stopPhraseTimer() {
                if (phraseTimerInterval) {
                    clearInterval(phraseTimerInterval);
                    phraseTimerInterval = null;
                }
            }

            function startPhraseTimer() {
                stopPhraseTimer();
                phraseTimeLeft = 300;
                updatePhraseTimerDisplay();
                phraseTimer.classList.remove('hidden');
                phraseTimerInterval = setInterval(() => {
                    phraseTimeLeft--;
                    updatePhraseTimerDisplay();
                    if (phraseTimeLeft <= 0) {
                        stopPhraseTimer();
                        submitPhraseCheck();
                    }
                }, 1000);
            }

            function updatePhraseTimerDisplay() {
                const mins = Math.floor(phraseTimeLeft / 60);
                const secs = phraseTimeLeft % 60;
                phraseTimer.textContent = `⏳ ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }

            function enterPhraseMode() {
                phraseStudyMode.classList.add('hidden');
                phrasePracticeContainer.classList.remove('hidden');
                phraseSummary.classList.add('hidden');
                phraseQuestions = selectPhraseQuestions(20);
                renderPhrasePractice();
                startPhraseTimer();
                phraseActive = true;
                phraseStartBtn.classList.add('hidden');
                phraseSubmitBtn.classList.remove('hidden');
                phraseReshuffleBtn.classList.remove('hidden');
                phraseRetryBtn.classList.remove('hidden');
                phraseTimer.classList.remove('hidden');
            }

            function submitPhraseCheck() {
                if (!phraseActive) return;
                stopPhraseTimer();
                phraseActive = false;
                phraseSummaryGrid.innerHTML = '';
                phraseQuestions.forEach((q, idx) => {
                    const textarea = document.getElementById(`phraseQ-${idx}`);
                    const userAnswer = textarea ? textarea.value.trim() : '';
                    const feedbackDiv = document.getElementById(`phraseFeedback-${idx}`);
                    if (feedbackDiv) {
                        feedbackDiv.style.display = 'block';
                        feedbackDiv.innerHTML = `✓ 正确答案：<strong style="color:var(--primary);">${q.en}</strong>`;
                    }
                    const isCorrect = userAnswer.toLowerCase() === q.en.toLowerCase();
                    const itemDiv = document.createElement('div');
                    itemDiv.className = `summary-item ${isCorrect ? 'is-correct' : ''}`;
                    itemDiv.innerHTML = `
                        <div class="summary-zh">${idx+1}. ${q.zh}</div>
                        <div class="summary-user">你的答案：${userAnswer || '(未填写)'}</div>
                        <div class="summary-correct">正确：${q.en}</div>
                    `;
                    phraseSummaryGrid.appendChild(itemDiv);
                });
                phraseSummary.classList.remove('hidden');
                phraseSubmitBtn.classList.add('hidden');
                phraseReshuffleBtn.classList.add('hidden');
                phraseTimer.classList.add('hidden');
                phraseRetryBtn.classList.remove('hidden');
                document.querySelectorAll('#phrasePracticeContainer textarea').forEach(ta => ta.disabled = true);
            }

            function resetPhrase() {
                stopPhraseTimer();
                phraseActive = false;
                phraseStudyMode.classList.remove('hidden');
                phrasePracticeContainer.classList.add('hidden');
                phraseSummary.classList.add('hidden');
                phraseStartBtn.classList.remove('hidden');
                phraseSubmitBtn.classList.add('hidden');
                phraseReshuffleBtn.classList.add('hidden');
                phraseRetryBtn.classList.add('hidden');
                phraseTimer.classList.add('hidden');
                phraseQuestions = [];
                phrasePracticeContainer.innerHTML = '';
                phraseSummaryGrid.innerHTML = '';
            }

            function reshufflePhrase() {
                if (!phraseActive) return;
                stopPhraseTimer();
                phraseQuestions = selectPhraseQuestions(20);
                renderPhrasePractice();
                phraseSummary.classList.add('hidden');
                document.querySelectorAll('#phrasePracticeContainer textarea').forEach(ta => ta.disabled = false);
                startPhraseTimer();
                phraseActive = true;
                phraseSubmitBtn.classList.remove('hidden');
                phraseReshuffleBtn.classList.remove('hidden');
                phraseRetryBtn.classList.remove('hidden');
            }

            function exportPhraseResults() {
                if (!phraseQuestions.length) return;
                let text = "REBORN 雅思写作表达检查结果 (政府与公共政策·词组)\n================================\n";
                phraseQuestions.forEach((q, idx) => {
                    const textarea = document.getElementById(`phraseQ-${idx}`);
                    const userAns = textarea ? textarea.value.trim() : '';
                    text += `${idx+1}. ${q.zh}\n`;
                    text += `   你的答案: ${userAns || '未填写'}\n`;
                    text += `   正确答案: ${q.en}\n\n`;
                });
                const blob = new Blob([text], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'government_phrases_result.txt';
                a.click();
                URL.revokeObjectURL(url);
            }

            // ============================================================
            // 8. 句型逻辑
            // ============================================================
            function renderSentencePractice() {
                sentencePracticeContainer.innerHTML = '';
                sentencePool.forEach((q, idx) => {
                    const div = document.createElement('div');
                    div.className = 'practice-item';
                    div.innerHTML = `
                        <div class="practice-zh">
                            <span>${idx + 1}. ${q.zh}</span>
                            <span class="practice-tag">${q.category}</span>
                        </div>
                        <textarea id="sentenceQ-${idx}" placeholder="请输入对应的英文翻译..." style="min-height:80px;"></textarea>
                        <div class="answer-toggle-area">
                            <button class="btn btn-outline btn-sm toggle-answer-btn" data-idx="${idx}">👁️ 查看答案</button>
                            <div id="sentenceAnswer-${idx}" class="answer-box">${q.en}</div>
                        </div>
                    `;
                    sentencePracticeContainer.appendChild(div);
                });

                document.querySelectorAll('.toggle-answer-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = this.getAttribute('data-idx');
                        const answerBox = document.getElementById(`sentenceAnswer-${idx}`);
                        if (answerBox.classList.contains('visible')) {
                            answerBox.classList.remove('visible');
                            this.textContent = '👁️ 查看答案';
                        } else {
                            answerBox.classList.add('visible');
                            this.textContent = '🙈 隐藏答案';
                        }
                    });
                });
            }

            function enterSentenceMode() {
                sentenceStudyMode.classList.add('hidden');
                sentencePracticeContainer.classList.remove('hidden');
                renderSentencePractice();
                sentenceStartBtn.classList.add('hidden');
                sentenceRetryBtn.classList.remove('hidden');
            }

            function resetSentence() {
                sentenceStudyMode.classList.remove('hidden');
                sentencePracticeContainer.classList.add('hidden');
                sentenceStartBtn.classList.remove('hidden');
                sentenceRetryBtn.classList.add('hidden');
                sentencePracticeContainer.innerHTML = '';
            }

            // ============================================================
            // 9. 模式切换
            // ============================================================
            const modeTabs = document.querySelectorAll('.mode-tab');
            const phrasePanel = document.getElementById('phrasePanel');
            const sentencePanel = document.getElementById('sentencePanel');

            modeTabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    modeTabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    const mode = this.getAttribute('data-mode');
                    if (mode === 'phrase') {
                        phrasePanel.classList.add('active');
                        sentencePanel.classList.remove('active');
                    } else {
                        sentencePanel.classList.add('active');
                        phrasePanel.classList.remove('active');
                    }
                });
            });

            // ============================================================
            // 10. 事件绑定
            // ============================================================
            phraseStartBtn.addEventListener('click', enterPhraseMode);
            phraseSubmitBtn.addEventListener('click', () => { if (phraseActive) { stopPhraseTimer();
                    submitPhraseCheck(); } });
            phraseReshuffleBtn.addEventListener('click', reshufflePhrase);
            phraseRetryBtn.addEventListener('click', resetPhrase);
            phraseExportBtn.addEventListener('click', exportPhraseResults);

            sentenceStartBtn.addEventListener('click', enterSentenceMode);
            sentenceRetryBtn.addEventListener('click', resetSentence);

            // ============================================================
            // 11. 初始化
            // ============================================================
            renderPhraseTables();
            renderSentenceTables();
        })();
    </script>
</body>
</html>
