* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
    font-family: 'Roboto', 'Noto Sans SC', sans-serif;
    background: #1A1A1A;
    color: #FFFFFF;
    transition: background 0.3s ease, color 0.3s ease;
}
body.light-mode { background: #FFFFFF; color: #1A1A1A; }

/* ===== 密码锁屏 ===== */
#lockScreen {
    position: fixed; inset: 0;
    background: #1A1A1A;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 2rem 1.5rem;
    z-index: 99999;
    transition: opacity 0.5s ease, transform 0.5s ease;
}
#lockScreen.hide { opacity: 0; transform: translateY(-30px); pointer-events: none; }
.lock-hex-row { position: relative; width: 80px; height: 90px; margin-bottom: 24px; }
.lock-hex-row div {
    position: absolute; width: 60px; height: 70px;
    border: 2px solid #fff; border-radius: 2px;
    animation: hexAppear 3.5s ease-in-out infinite;
}
.lock-hex-row div:nth-child(1) { top: 0; left: 10px; }
.lock-hex-row div:nth-child(2) { top: 10px; left: 45px; transform: scale(0.85); }
.lock-hex-row div:nth-child(3) { top: 10px; left: -25px; transform: scale(0.85); }
.lock-hex-row div:nth-child(4) { top: 40px; left: 28px; transform: scale(0.7); }
.lock-hex-row div:nth-child(5) { top: 40px; left: -8px; transform: scale(0.7); }
@keyframes hexAppear {
    0%{opacity:0;transform:scale(.8) rotate(10deg);}
    20%{opacity:1;transform:scale(1) rotate(0);}
    80%{opacity:1;transform:scale(1) rotate(0);}
    100%{opacity:0;transform:scale(.8) rotate(-10deg);}
}
.lock-title { color: #fff; font-size: 1.7rem; font-weight: 700; letter-spacing: 2px; margin-bottom: 4px; }
.lock-sub { color: #999; font-size: 0.85rem; letter-spacing: 4px; margin-bottom: 32px; text-transform: uppercase; }
.lock-card {
    background: #262626; border: 1px solid #3a3a3a;
    border-radius: 16px; padding: 28px 24px;
    width: 100%; max-width: 380px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
}
.lock-label { color: #ccc; font-size: 0.95rem; text-align: center; margin-bottom: 14px; }
.lock-input {
    width: 100%; padding: 14px 18px; font-size: 1.05rem;
    background: #1A1A1A; border: 1px solid #3a3a3a;
    border-radius: 12px; color: #fff; text-align: center;
    letter-spacing: 3px; outline: none; font-family: inherit;
}
.lock-input:focus { border-color: #2E5938; }
.lock-err { color: #ff6b6b; font-size: 0.85rem; height: 18px; margin-top: 10px; text-align: center; }
.lock-btn {
    width: 100%; margin-top: 10px; padding: 14px;
    background: #2E5938; color: #fff; border: none;
    border-radius: 40px; font-size: 1rem; font-weight: 600;
    letter-spacing: 2px; cursor: pointer; font-family: inherit;
    transition: all 0.15s; box-shadow: 0 4px 0 #1f452b;
}
.lock-btn:hover { background: #3a6e4a; }

/* ===== 主应用 ===== */
#app { position: fixed; inset: 0; overflow: hidden; opacity: 0; transition: opacity 0.5s ease; }
#app.ready { opacity: 1; }

.page {
    position: absolute; inset: 0;
    overflow: hidden;
    transform: translateX(100%);
    transition: transform 0.5s cubic-bezier(0.65, 0, 0.35, 1);
    will-change: transform;
    background: #1A1A1A;
    z-index: 1;

body.light-mode .page { background: #FFFFFF; }
.page.active { transform: translateX(0); }
.page.behind { transform: translateX(-30%); }
.page iframe {

.theme-toggle-global {

    cursor: pointer;
    z-index: 2147483000;

    pointer-events: auto;

body.light-mode .theme-toggle-global { background: #E0E0E0; }
.theme-toggle-global .dot {

<script>
(function() {
    'use strict';

    const VALID = ['61211216', 'reborn2026'];
    const lockScreen = document.getElementById('lockScreen');
    const lockInput = document.getElementById('lockInput');
    const lockBtn = document.getElementById('lockBtn');
    const lockErr = document.getElementById('lockErr');
    const app = document.getElementById('app');
    const themeToggle = document.getElementById('themeToggleGlobal');

    // ⭐ 不再用 sessionStorage 判断，每次进入 main.html 都必须输密码
    function checkAuth() {
        lockScreen.style.display = 'flex';
        setTimeout(() => lockInput.focus(), 300);
    }

    function tryUnlock() {
        const v = lockInput.value.trim();
        if (VALID.includes(v)) {
            unlockApp();
        } else {
            lockErr.textContent = '密码错误，请重试';
            lockInput.value = '';
            lockInput.focus();
        }
    }

    function unlockApp() {
        lockScreen.classList.add('hide');
        setTimeout(() => {
            lockScreen.style.display = 'none';
            app.classList.add('ready');
        }, 500);
    }

    lockBtn.addEventListener('click', tryUnlock);
    lockInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

    // 麦克风权限：进首页申请一次，全站复用
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
                window.__micStream = stream;
            })
            .catch(function(err) {});
    }

    // 主题
    function syncIframeTheme(iframe) {
        try {
            const doc = iframe.contentDocument;
            if (!doc || !doc.body) return;
            const isLight = document.body.classList.contains('light-mode');
            if (isLight) doc.body.classList.add('light-mode');
            else doc.body.classList.remove('light-mode');
            doc.querySelectorAll('[id$="LogoText"], .logo-text').forEach(el => {
                if (isLight && el.textContent.includes('黑皮书'))
                    el.textContent = el.textContent.replace('黑皮书', '白皮书');
                else if (!isLight && el.textContent.includes('白皮书'))
                    el.textContent = el.textContent.replace('白皮书', '黑皮书');
            });
            if (iframe.contentWindow) {
                iframe.contentWindow.postMessage({ type: 'theme', isLight: isLight }, '*');
            }
        } catch (err) {}
    }

    function applyTheme(isLight) {
        if (isLight) document.body.classList.add('light-mode');
        else document.body.classList.remove('light-mode');
        document.querySelectorAll('iframe').forEach(syncIframeTheme);
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
    }

    if (localStorage.getItem('theme') === 'light') applyTheme(true);
    else applyTheme(false);

    themeToggle.addEventListener('click', () => {
        applyTheme(!document.body.classList.contains('light-mode'));
    });

    // 导航
    const navBack = document.getElementById('navBack');
    const navBackLevel = document.getElementById('navBackLevel');
    const navHome = document.getElementById('navHome');
    const historyStack = [];

    function getPage(name) { return document.querySelector(`.page[data-page="${name}"]`); }

    function navigateTo(targetName, pushHistory) {
        const current = document.querySelector('.page.active');
        const target = getPage(targetName);
        if (!target || (current && current.dataset.page === targetName)) return;

        if (current) {
            current.classList.remove('active');
            current.classList.add('behind');
            setTimeout(() => current.classList.remove('behind'), 500);
        }
        target.classList.add('active');

        const iframe = target.querySelector('iframe');
        if (iframe) setTimeout(() => syncIframeTheme(iframe), 100);

        updateNavButtons(targetName);

        if (pushHistory !== false && current) historyStack.push(current.dataset.page);
    }

    function goBack() {
        const prev = historyStack.pop();
        navigateTo(prev || 'home', false);
    }

    function goHome() {
        historyStack.length = 0;
        navigateTo('home', false);
    }

    function goBackLevel() {
        const current = document.querySelector('.page.active');
        if (!current) return;
        const backTarget = current.dataset.back;
        if (backTarget) navigateTo(backTarget);
    }

    function updateNavButtons(pageName) {
        const current = document.querySelector('.page.active');
        if (!current) return;

        if (pageName === 'home') {
            navBack.classList.remove('show');
            navBackLevel.classList.remove('show');
            navHome.classList.remove('show');
            return;
        }

        navBack.classList.add('show');

        const backLevelText = current.dataset.backText;
        if (backLevelText) {
            navBackLevel.textContent = backLevelText;
            navBackLevel.classList.add('show');
        } else {
            navBackLevel.classList.remove('show');
        }

        navHome.classList.add('show');
    }

    navBack.addEventListener('click', goBack);
    navBackLevel.addEventListener('click', goBackLevel);
    navHome.addEventListener('click', goHome);

    document.querySelectorAll('.home-button').forEach(btn => {
        btn.addEventListener('click', function(e) {
            const target = this.dataset.nav;
            const rect = this.getBoundingClientRect();
            const ripple = document.createElement('div');
            const size = Math.max(rect.width, rect.height);
            ripple.style.cssText = `
                position:absolute;border-radius:50%;transform:scale(0);
                animation:ripple 0.6s linear;pointer-events:none;
                width:${size}px;height:${size}px;
                left:${e.clientX - rect.left - size/2}px;
                top:${e.clientY - rect.top - size/2}px;
                background:${document.body.classList.contains('light-mode') ? 'rgba(26,26,26,0.15)' : 'rgba(255,255,255,0.25)'};
            `;
            this.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
            setTimeout(() => navigateTo(target), 80);
        });
    });

    const PAGE_MAP = {
        'core-entry.html': { '听力词汇': 'listening', '阅读词汇': 'reading', '口语题库': 'speaking-entry', '写作素材': 'writing' },
        'listening-entry.html': { '词汇学习': 'listening-study', '默写检查': 'listening-quiz' },
        'speaking-entry.html': { '口语实考题库': 'speaking-bank', '口语模拟考试': 'speaking-mock' },
        'writing-entry.html': { 'Task 1': 'writing-t1', 'Task 2': 'writing-t2' },
        'writing-t1-entry.html': { '动态图': 't1-dynamic', '静态图': 't1-static', '地图': 't1-map', '流程图': 't1-flow' },
        'writing-t2-entry.html': {
            '政府与公共政策': 't2-gov', '健康与心理': 't2-health', '教育': 't2-edu',
            '经济与消费': 't2-econ', '科技与工作': 't2-tech', '媒体与广告': 't2-media',
            '能源与环境': 't2-energy', '社会生活与城市': 't2-city', '文化与全球化': 't2-culture'
        },
        'reading-538.html': {
            '538核心词汇': 'reading',
            '高阶核心词汇': 'reading-advanced',
            '高阶词汇': 'reading-advanced',
            'advanced': 'reading-advanced'
        }
    };

    function getIframeFileName(iframe) {
        const src = iframe.getAttribute('src') || '';
        return src.split('?')[0].split('/').pop();
    }

    document.querySelectorAll('.page iframe').forEach(iframe => {
        iframe.addEventListener('load', function() {
            try {
                const doc = iframe.contentDocument;
                if (!doc) return;
                doc.querySelectorAll('.theme-slider-container, .theme-slider').forEach(el => el.style.display = 'none');
                syncIframeTheme(iframe);

                const fileName = getIframeFileName(iframe);
                const map = PAGE_MAP[fileName];
                if (map) {
                    doc.querySelectorAll('button, a').forEach(el => {
                        el.addEventListener('click', function(e) {
                            const url = this.dataset.url || this.getAttribute('href') || '';
                            for (const [key, targetPage] of Object.entries(map)) {
                                if (url.includes(key) || this.textContent.includes(key)) {
                                    e.preventDefault();
                                    e.stopPropagation();
                                    navigateTo(targetPage);
                                    return;
                                }
                            }
                        }, true);
                    });
                }
            } catch (err) {}
        });
    });

    // 接收 iframe 消息
    window.addEventListener('message', function(e) {
        const data = e.data;
        if (!data || !data.type) return;
        if (data.type === 'navigate' && data.page) {
            navigateTo(data.page);
        }
        if (data.type === 'requestMic') {
            if (window.__micStream && window.__micStream.active) {
                try { e.source.postMessage({ type: 'micGranted' }, '*'); } catch(err) {}
            } else if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then(function(stream) {
                        window.__micStream = stream;
                        try { e.source.postMessage({ type: 'micGranted' }, '*'); } catch(err) {}
                    })
                    .catch(function(err) {
                        try { e.source.postMessage({ type: 'micDenied', error: String(err) }, '*'); } catch(err2) {}
                    });
            }
        }
        if (data.type === 'speak' && data.text) {
            var sender = e.source;
            playText(data.text, data.accent, function() {
                try { sender.postMessage({ type: 'speakEnd' }, '*'); } catch(err) {}
            });
        }
    });

    function playText(text, accent, onDone) {
        if (!text) { if (onDone) onDone(); return; }

        var fired = false;
        function done() {
            if (fired) return;
            fired = true;
            if (onDone) { try { onDone(); } catch(e) {} }
        }

        try {
            var audio = new Audio('https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) + '&type=2');
            audio.volume = 0.9;
            audio.onended = done;
            audio.onerror = function() {
                fallbackToSpeech(text, accent, done);
            };
            var playPromise = audio.play();
            if (playPromise && playPromise.catch) {
                playPromise.catch(function() {
                    fallbackToSpeech(text, accent, done);
                });
            }
            setTimeout(done, Math.max(4000, text.length * 150));
        } catch (err) {
            fallbackToSpeech(text, accent, done);
        }
    }

    function fallbackToSpeech(text, accent, done) {
        if ('speechSynthesis' in window) {
            try {
                var u = new SpeechSynthesisUtterance(text);
                u.lang = (accent === 'us') ? 'en-US' : 'en-GB';
                u.rate = 0.9;
                u.onend = done;
                u.onerror = done;
                window.speechSynthesis.speak(u);
                setTimeout(done, Math.max(4000, text.length * 150));
                return;
            } catch (err) {}
        }
        done();
    }

    checkAuth();
    updateNavButtons('home');

})();
</script>
</body>
</html>
