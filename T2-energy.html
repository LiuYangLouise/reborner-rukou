<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>REBORN新生留学 · 能源与环境类双模式练习</title>
    <style>
        :root {
            --primary: #2D593E;
            --secondary: #EBEDD4;
            --accent: #AE7645;
            --text-dark: #021502;
            --text-light: #975625;
            --bg-light: #F4F3EC;
            --white: #FFFFFF;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
            padding: 1.5rem 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-container {
            max-width: 1000px;
            width: 100%;
            background: var(--white);
            border-radius: 28px;
            padding: 2rem 1.8rem;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 1px;
            margin-bottom: 0.3rem;
        }

        .header-subtitle {
            font-size: 1.2rem;
            font-weight: 400;
            color: var(--text-light);
            background: var(--secondary);
            display: inline-block;
            padding: 0.3rem 1.8rem;
            border-radius: 30px;
            letter-spacing: 0.5px;
        }

        .mode-tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .mode-tab {
            padding: 10px 32px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-size: 1rem;
            transition: all 0.2s;
        }

        .mode-tab.active {
            background: var(--primary);
            color: white;
        }

        .mode-tab:hover {
            background: var(--primary);
            color: white;
        }

        .mode-panel {
            display: none;
        }

        .mode-panel.active {
            display: block;
        }

        .section-card {
            background: var(--white);
            border-radius: 20px;
            padding: 1.6rem 1.4rem;
            margin-bottom: 1.8rem;
            border: 1px solid rgba(45, 89, 62, 0.1);
            box-shadow: var(--shadow);
            transition: all 0.2s;
        }

        .section-title {
            color: var(--primary);
            font-size: 1.4rem;
            margin-bottom: 1.2rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 650;
        }

        .section-title-left {
            display: flex;
            align-items: center;
        }

        .section-title-left::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 24px;
            background: var(--accent);
            margin-right: 12px;
            border-radius: 6px;
        }

        .toggle-en-btn {
            padding: 4px 18px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-size: 0.85rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .toggle-en-btn:hover {
            background: var(--primary);
            color: white;
        }

        .toggle-en-btn.showing {
            background: var(--primary);
            color: white;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }

        th {
            background: var(--secondary);
            color: var(--primary);
            text-align: left;
            padding: 12px 10px;
            font-weight: 600;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        .zh-text {
            font-weight: 500;
            color: var(--text-dark);
        }

        .en-text {
            font-weight: 500;
            color: var(--primary);
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .en-hidden .en-text {
            display: none;
        }

        .control-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.2rem;
            margin: 1.8rem 0 1rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 1rem;
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
            transition: all 0.2s;
            letter-spacing: 0.4px;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #1e3d2a;
        }

        .btn-sm {
            padding: 6px 18px;
            font-size: 0.85rem;
        }

        .btn:disabled {
            opacity: 0.6;
            pointer-events: none;
        }

        .timer-box {
            background: var(--secondary);
            padding: 0.5rem 1.4rem;
            border-radius: 30px;
            font-weight: 700;
            color: var(--primary);
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .practice-item {
            background: #fafaf5;
            border-radius: 18px;
            padding: 1.4rem;
            margin-bottom: 1.2rem;
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        .practice-zh {
            font-weight: 700;
            margin-bottom: 0.8rem;
            color: var(--text-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .practice-tag {
            font-size: 0.7rem;
            background: var(--primary);
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
        }

        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #ddd;
            border-radius: 14px;
            font-family: 'Georgia', serif;
            font-size: 0.95rem;
            resize: vertical;
            min-height: 70px;
            background: white;
        }

        textarea:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(45, 89, 62, 0.08);
        }

        .feedback {
            margin-top: 0.6rem;
            font-size: 0.9rem;
            background: #f0f0f0;
            padding: 0.5rem 1rem;
            border-radius: 12px;
            display: none;
        }

        .answer-toggle-area {
            margin-top: 0.6rem;
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .answer-box {
            display: none;
            background: #e8f5e9;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            font-family: 'Georgia', serif;
            color: var(--primary);
            font-weight: 600;
            flex: 1;
            min-width: 200px;
        }

        .answer-box.visible {
            display: block;
        }

        .summary-container {
            margin-top: 2rem;
            background: var(--white);
            border-radius: 24px;
            padding: 1.8rem;
            border: 2px dashed var(--primary);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .summary-item {
            background: #f9f9f6;
            padding: 12px;
            border-radius: 14px;
        }

        .summary-zh {
            font-weight: 600;
            color: var(--text-dark);
        }

        .summary-user {
            color: #c62828;
            font-family: 'Georgia', serif;
        }

        .summary-correct {
            color: var(--primary);
            font-weight: 600;
            font-family: 'Georgia', serif;
        }

        .summary-item.is-correct .summary-user {
            color: #2e7d32;
        }

        .export-area {
            margin-top: 1.2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        @media (min-width: 768px) {
            .summary-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .hidden {
            display: none !important;
        }

        footer {
            margin-top: 2rem;
            color: var(--text-light);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="main-container" id="appRoot">
        <header>
            <h1 class="header-title">REBORN新生留学 雅思写作提分表达</h1>
            <p class="header-subtitle">能源与环境 · 词组与句型双模式练习</p>
        </header>

        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="phrase">📚 词组检查</button>
            <button class="mode-tab" data-mode="sentence">✍️ 句型检查</button>
        </div>

        <!-- 词组检查 -->
        <div id="phrasePanel" class="mode-panel active">
            <div id="phraseStudyMode">
                <div id="phraseTableSections"></div>
            </div>
            <div class="control-bar">
                <div id="phraseTimer" class="timer-box hidden">⏳ 05:00</div>
                <button id="phraseStartBtn" class="btn btn-primary">📋 开始检查</button>
                <button id="phraseSubmitBtn" class="btn btn-outline hidden">⏹️ 提前提交</button>
                <button id="phraseReshuffleBtn" class="btn btn-outline hidden">🔄 换一组</button>
                <button id="phraseRetryBtn" class="btn btn-outline hidden">🔁 再来一次</button>
            </div>
            <div id="phrasePracticeContainer" class="hidden"></div>
            <div id="phraseSummary" class="summary-container hidden">
                <h2 style="color:var(--primary); margin-bottom:1rem;">📸 检查结果对照</h2>
                <div id="phraseSummaryGrid" class="summary-grid"></div>
                <div class="export-area">
                    <button id="phraseExportBtn" class="btn btn-outline">📤 导出结果 (文本)</button>
                </div>
            </div>
        </div>

        <!-- 句型检查 -->
        <div id="sentencePanel" class="mode-panel">
            <div id="sentenceStudyMode">
                <div id="sentenceTableSections"></div>
            </div>
            <div class="control-bar">
                <button id="sentenceStartBtn" class="btn btn-primary">📋 开始句型练习</button>
                <button id="sentenceRetryBtn" class="btn btn-outline hidden">🔁 再来一次</button>
            </div>
            <div id="sentencePracticeContainer" class="hidden"></div>
        </div>

        <footer>© REBORN新生留学 · 能源与环境类写作表达</footer>
    </div>

    <script>
        (function() {
            // ============================================================
            // 1. 词组数据（直接从原HTML提取）
            // ============================================================
            const expressionData = {
                "环境问题与全球变暖": [
                    { zh: "全球变暖", en: "global warming" },
                    { zh: "气候变化", en: "climate change" },
                    { zh: "温室气体", en: "greenhouse gases" },
                    { zh: "碳排放", en: "carbon emissions" },
                    { zh: "碳足迹", en: "carbon footprint" },
                    { zh: "冰川融化", en: "melting glaciers" },
                    { zh: "海平面上升", en: "rising sea levels" },
                    { zh: "极端天气", en: "extreme weather" },
                    { zh: "生态失衡", en: "ecological imbalance" },
                    { zh: "环境恶化", en: "environmental degradation" },
                    { zh: "破坏生态系统", en: "damage the ecosystem" },
                    { zh: "恢复生态环境", en: "restore the ecological environment" }
                ],
                "各类污染": [
                    { zh: "空气污染", en: "air pollution" },
                    { zh: "水污染", en: "water contamination / water pollution" },
                    { zh: "噪音污染", en: "noise pollution" },
                    { zh: "土壤污染", en: "soil pollution" },
                    { zh: "工业废气", en: "industrial waste gas" },
                    { zh: "汽车尾气", en: "vehicle exhaust" },
                    { zh: "一次性产品", en: "disposable products" },
                    { zh: "塑料垃圾", en: "plastic waste" },
                    { zh: "生活垃圾", en: "domestic garbage" },

                    { zh: "限制一次性用品", en: "limit disposable products" },
                    { zh: "垃圾分类", en: "garbage classification" }
                ],
                "资源与能源": [
                    { zh: "不可再生资源", en: "non-renewable resources" },
                    { zh: "可再生能源", en: "renewable energy" },
                    { zh: "化石燃料", en: "fossil fuels" },
                    { zh: "太阳能", en: "solar energy" },
                    { zh: "风能", en: "wind energy" },
                    { zh: "水能", en: "hydropower energy" },
                    { zh: "节约自然资源", en: "conserve natural resources" },
                    { zh: "资源短缺", en: "resource shortage" },
                    { zh: "过度开采", en: "over-exploitation" },
                    { zh: "能源消耗", en: "energy consumption" },
                    { zh: "低碳生活", en: "low-carbon lifestyle" },
                    { zh: "节能减排", en: "energy conservation and emission reduction" },
                    { zh: "可持续发展", en: "sustainable development" },
                    { zh: "普及清洁能源", en: "popularise clean energy" },
                    { zh: "依赖传统能源", en: "rely on traditional energy" }
                ],
                "动物与物种保护": [
                    { zh: "物种灭绝", en: "species extinction" },
                    { zh: "濒危物种", en: "endangered species" },
                    { zh: "野生动物", en: "wild animals / wildlife" },
                    { zh: "栖息地破坏", en: "habitat destruction" },
                    { zh: "非法捕猎", en: "illegal hunting" },
                    { zh: "保护生物多样性", en: "protect biodiversity" },
                    { zh: "珍稀动植物", en: "rare flora and fauna" },
                    { zh: "人类活动干扰", en: "disturbance from human activities" },
                    { zh: "动物园保育", en: "zoo conservation" },
                    { zh: "禁止动物实验", en: "ban animal testing" },
                    { zh: "维护生态平衡", en: "maintain ecological balance" },
                    { zh: "尊重生命", en: "respect all living creatures" }
                ],
                "环境问题成因与解决措施": [
                    { zh: "人口快速增长", en: "the rapid growth of population" },
                    { zh: "工业化进程", en: "the process of industrialisation" },
                    { zh: "城市化发展", en: "urban expansion" },
                    { zh: "公众环保意识薄弱", en: "low public environmental awareness" },
                    { zh: "追求经济利益", en: "pursue economic profits" },
                    { zh: "无节制的消费", en: "uncontrolled consumption" },
                    { zh: "严格环保法律", en: "stricter environmental laws" },
                    { zh: "出台政策", en: "introduce relevant policies" },
                    { zh: "征收环保税", en: "impose environmental taxes" },
                    { zh: "普及环保教育", en: "popularise environmental education" },
                    { zh: "研发清洁能源", en: "develop clean energy" },
                    { zh: "循环利用", en: "reuse and recycle" },
                    { zh: "承担环保责任", en: "shoulder environmental responsibility" },
                    { zh: "鼓励绿色出行", en: "advocate green travel" },
                    { zh: "限制私家车使用", en: "restrict the use of private cars" }
                ]
            };

            const allPhrases = [];
            for (let [category, items] of Object.entries(expressionData)) {
                items.forEach(item => allPhrases.push({ ...item, category }));
            }

            // ============================================================
            // 2. 句型数据（12句）
            // ============================================================
            const sentencePool = [
                { zh: "全球变暖导致冰川融化和海平面上升，引发极端天气频发，严重破坏生态系统。",
                    en: "Global warming has led to melting glaciers and rising sea levels, causing frequent extreme weather and severely damaging the ecosystem.",
                    category: "环境问题与全球变暖" },
                { zh: "温室气体排放增加是气候变化的主要原因，减少碳足迹已成为当务之急。",
                    en: "The increase in greenhouse gas emissions is the main cause of climate change, and reducing our carbon footprint has become an urgent priority.",
                    category: "环境问题与全球变暖" },
                { zh: "如果不采取有效措施，环境恶化将导致生态失衡，威胁人类的生存环境。",
                    en: "If effective measures are not taken, environmental degradation will lead to ecological imbalance and threaten the living environment of human beings.",
                    category: "环境问题与全球变暖" },
                { zh: "空气污染主要来自工业废气和汽车尾气，而水污染则与塑料垃圾和工业废水密切相关。",
                    en: "Air pollution mainly comes from industrial waste gas and vehicle exhaust, while water pollution is closely related to plastic waste and industrial wastewater.",
                    category: "各类污染" },
                { zh: "垃圾分类和循环利用是减少生活垃圾、降低环境污染的有效手段。",
                    en: "Garbage classification and recycling are effective ways to reduce domestic garbage and lower environmental pollution.",
                    category: "各类污染" },
                { zh: "政府应当限制一次性产品的使用，并出台政策鼓励公众减少塑料垃圾。",
                    en: "The government should limit the use of disposable products and introduce policies to encourage the public to reduce plastic waste.",
                    category: "各类污染" },
                { zh: "化石燃料等不可再生资源的过度开采导致了资源短缺，因此大力发展可再生能源势在必行。",
                    en: "The over-exploitation of non-renewable resources such as fossil fuels has led to resource shortages, so it is imperative to develop renewable energy.",
                    category: "资源与能源" },
                { zh: "太阳能和风能等清洁能源的普及有助于节能减排，推动可持续发展。",
                    en: "The popularisation of clean energy such as solar and wind energy contributes to energy conservation and emission reduction, promoting sustainable development.",
                    category: "资源与能源" },
                { zh: "依赖传统能源不仅加剧了能源消耗，还增加了碳排放，对环境造成长期损害。",
                    en: "Relying on traditional energy not only increases energy consumption, but also raises carbon emissions, causing long-term damage to the environment.",
                    category: "资源与能源" },
                { zh: "物种灭绝和栖息地破坏威胁着生物多样性，保护濒危野生动物已成为全球共识。",
                    en: "Species extinction and habitat destruction threaten biodiversity, and protecting endangered wildlife has become a global consensus.",
                    category: "动物与物种保护" },
                { zh: "非法捕猎和人类活动干扰是珍稀动植物面临的主要威胁，需要加强法律保护。",
                    en: "Illegal hunting and disturbance from human activities are the main threats to rare flora and fauna, requiring stronger legal protection.",
                    category: "动物与物种保护" },
                { zh: "政府应当严格环保法律、征收环保税，并普及环保教育，从而提高公众的环保意识。",
                    en: "The government should enforce stricter environmental laws, impose environmental taxes, and popularise environmental education, thereby raising public environmental awareness.",
                    category: "解决措施" }
            ];

            // ============================================================
            // 3. DOM - 词组模式
            // ============================================================
            const phraseStudyMode = document.getElementById('phraseStudyMode');
            const phraseTableSections = document.getElementById('phraseTableSections');
            const phrasePracticeContainer = document.getElementById('phrasePracticeContainer');
            const phraseSummary = document.getElementById('phraseSummary');
            const phraseSummaryGrid = document.getElementById('phraseSummaryGrid');
            const phraseTimer = document.getElementById('phraseTimer');
            const phraseStartBtn = document.getElementById('phraseStartBtn');
            const phraseSubmitBtn = document.getElementById('phraseSubmitBtn');
            const phraseReshuffleBtn = document.getElementById('phraseReshuffleBtn');
            const phraseRetryBtn = document.getElementById('phraseRetryBtn');
            const phraseExportBtn = document.getElementById('phraseExportBtn');

            let phraseQuestions = [];
            let phraseTimerInterval = null;
            let phraseTimeLeft = 300;
            let phraseActive = false;

            // ============================================================
            // 4. DOM - 句型模式
            // ============================================================
            const sentenceStudyMode = document.getElementById('sentenceStudyMode');
            const sentenceTableSections = document.getElementById('sentenceTableSections');
            const sentencePracticeContainer = document.getElementById('sentencePracticeContainer');
            const sentenceStartBtn = document.getElementById('sentenceStartBtn');
            const sentenceRetryBtn = document.getElementById('sentenceRetryBtn');

            // ============================================================
            // 5. 渲染函数 - 词组
            // ============================================================
            function renderPhraseTables() {
                let html = '';
                for (let [title, items] of Object.entries(expressionData)) {
                    html += `
                        <div class="section-card">
                            <div class="section-title">
                                <span class="section-title-left">${title}</span>
                                <button class="toggle-en-btn" data-panel="phrase" data-category="${title}">👁️ 显示英文</button>
                            </div>
                            <div class="table-container">
                                <table class="phrase-table en-hidden" data-category="${title}">
                                    <thead><tr><th>中文表达</th><th>英文表达</th></tr></thead>
                                    <tbody>
                                        ${items.map(i => `<tr><td class="zh-text">${i.zh}</td><td class="en-text">${i.en}</td></tr>`).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                }
                phraseTableSections.innerHTML = html;

                document.querySelectorAll('#phraseTableSections .toggle-en-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const category = this.getAttribute('data-category');
                        const table = document.querySelector(
                            `#phraseTableSections .phrase-table[data-category="${category}"]`);
                        if (table) {
                            table.classList.toggle('en-hidden');
                            const isHidden = table.classList.contains('en-hidden');
                            this.textContent = isHidden ? '👁️ 显示英文' : '🙈 隐藏英文';
                            this.classList.toggle('showing', !isHidden);
                        }
                    });
                });
            }

            // ============================================================
            // 6. 渲染函数 - 句型
            // ============================================================
            function renderSentenceTables() {
                let html = `
                    <div class="section-card">
                        <div class="section-title">
                            <span class="section-title-left">📝 汉英对照句型</span>
                            <button class="toggle-en-btn" id="sentenceTableToggle">👁️ 显示英文</button>
                        </div>
                        <div class="table-container">
                            <table id="sentenceTable" class="en-hidden">
                                <thead><tr><th>中文句子</th><th>英文翻译</th></tr></thead>
                                <tbody>
                                    ${sentencePool.map((s, idx) => `
                                        <tr>
                                            <td class="zh-text">${idx+1}. ${s.zh}</td>
                                            <td class="en-text">${s.en}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                sentenceTableSections.innerHTML = html;

                const toggleBtn = document.getElementById('sentenceTableToggle');
                const table = document.getElementById('sentenceTable');
                if (toggleBtn && table) {
                    toggleBtn.addEventListener('click', function() {
                        table.classList.toggle('en-hidden');
                        const isHidden = table.classList.contains('en-hidden');
                        this.textContent = isHidden ? '👁️ 显示英文' : '🙈 隐藏英文';
                        this.classList.toggle('showing', !isHidden);
                    });
                }
            }

            // ============================================================
            // 7. 词组逻辑
            // ============================================================
            function selectPhraseQuestions(count = 20) {
                const shuffled = [...allPhrases].sort(() => 0.5 - Math.random());
                return shuffled.slice(0, Math.min(count, allPhrases.length));
            }

            function renderPhrasePractice() {
                phrasePracticeContainer.innerHTML = '';
                if (!phraseQuestions.length) return;
                phraseQuestions.forEach((q, idx) => {
                    const div = document.createElement('div');
                    div.className = 'practice-item';
                    div.innerHTML = `
                        <div class="practice-zh">
                            <span>${idx + 1}. ${q.zh}</span>
                            <span class="practice-tag">${q.category}</span>
                        </div>
                        <textarea id="phraseQ-${idx}" placeholder="请输入对应的英文表达..."></textarea>
                        <div id="phraseFeedback-${idx}" class="feedback"></div>
                    `;
                    phrasePracticeContainer.appendChild(div);
                });
            }

            function stopPhraseTimer() {
                if (phraseTimerInterval) {
                    clearInterval(phraseTimerInterval);
                    phraseTimerInterval = null;
                }
            }

            function startPhraseTimer() {
                stopPhraseTimer();
                phraseTimeLeft = 300;
                updatePhraseTimerDisplay();
                phraseTimer.classList.remove('hidden');
                phraseTimerInterval = setInterval(() => {
                    phraseTimeLeft--;
                    updatePhraseTimerDisplay();
                    if (phraseTimeLeft <= 0) {
                        stopPhraseTimer();
                        submitPhraseCheck();
                    }
                }, 1000);
            }

            function updatePhraseTimerDisplay() {
                const mins = Math.floor(phraseTimeLeft / 60);
                const secs = phraseTimeLeft % 60;
                phraseTimer.textContent = `⏳ ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }

            function enterPhraseMode() {
                phraseStudyMode.classList.add('hidden');
                phrasePracticeContainer.classList.remove('hidden');
                phraseSummary.classList.add('hidden');
                phraseQuestions = selectPhraseQuestions(20);
                renderPhrasePractice();
                startPhraseTimer();
                phraseActive = true;
                phraseStartBtn.classList.add('hidden');
                phraseSubmitBtn.classList.remove('hidden');
                phraseReshuffleBtn.classList.remove('hidden');
                phraseRetryBtn.classList.remove('hidden');
                phraseTimer.classList.remove('hidden');
            }

            function submitPhraseCheck() {
                if (!phraseActive) return;
                stopPhraseTimer();
                phraseActive = false;
                phraseSummaryGrid.innerHTML = '';
                phraseQuestions.forEach((q, idx) => {
                    const textarea = document.getElementById(`phraseQ-${idx}`);
                    const userAnswer = textarea ? textarea.value.trim() : '';
                    const feedbackDiv = document.getElementById(`phraseFeedback-${idx}`);
                    if (feedbackDiv) {
                        feedbackDiv.style.display = 'block';
                        feedbackDiv.innerHTML = `✓ 正确答案：<strong style="color:var(--primary);">${q.en}</strong>`;
                    }
                    const isCorrect = userAnswer.toLowerCase() === q.en.toLowerCase();
                    const itemDiv = document.createElement('div');
                    itemDiv.className = `summary-item ${isCorrect ? 'is-correct' : ''}`;
                    itemDiv.innerHTML = `
                        <div class="summary-zh">${idx+1}. ${q.zh}</div>
                        <div class="summary-user">你的答案：${userAnswer || '(未填写)'}</div>
                        <div class="summary-correct">正确：${q.en}</div>
                    `;
                    phraseSummaryGrid.appendChild(itemDiv);
                });
                phraseSummary.classList.remove('hidden');
                phraseSubmitBtn.classList.add('hidden');
                phraseReshuffleBtn.classList.add('hidden');
                phraseTimer.classList.add('hidden');
                phraseRetryBtn.classList.remove('hidden');
                document.querySelectorAll('#phrasePracticeContainer textarea').forEach(ta => ta.disabled = true);
            }

            function resetPhrase() {
                stopPhraseTimer();
                phraseActive = false;
                phraseStudyMode.classList.remove('hidden');
                phrasePracticeContainer.classList.add('hidden');
                phraseSummary.classList.add('hidden');
                phraseStartBtn.classList.remove('hidden');
                phraseSubmitBtn.classList.add('hidden');
                phraseReshuffleBtn.classList.add('hidden');
                phraseRetryBtn.classList.add('hidden');
                phraseTimer.classList.add('hidden');
                phraseQuestions = [];
                phrasePracticeContainer.innerHTML = '';
                phraseSummaryGrid.innerHTML = '';
            }

            function reshufflePhrase() {
                if (!phraseActive) return;
                stopPhraseTimer();
                phraseQuestions = selectPhraseQuestions(20);
                renderPhrasePractice();
                phraseSummary.classList.add('hidden');
                document.querySelectorAll('#phrasePracticeContainer textarea').forEach(ta => ta.disabled = false);
                startPhraseTimer();
                phraseActive = true;
                phraseSubmitBtn.classList.remove('hidden');
                phraseReshuffleBtn.classList.remove('hidden');
                phraseRetryBtn.classList.remove('hidden');
            }

            function exportPhraseResults() {
                if (!phraseQuestions.length) return;
                let text = "REBORN 雅思写作表达检查结果 (能源与环境·词组)\n================================\n";
                phraseQuestions.forEach((q, idx) => {
                    const textarea = document.getElementById(`phraseQ-${idx}`);
                    const userAns = textarea ? textarea.value.trim() : '';
                    text += `${idx+1}. ${q.zh}\n`;
                    text += `   你的答案: ${userAns || '未填写'}\n`;
                    text += `   正确答案: ${q.en}\n\n`;
                });
                const blob = new Blob([text], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'energy_phrases_result.txt';
                a.click();
                URL.revokeObjectURL(url);
            }

            // ============================================================
            // 8. 句型逻辑
            // ============================================================
            function renderSentencePractice() {
                sentencePracticeContainer.innerHTML = '';
                sentencePool.forEach((q, idx) => {
                    const div = document.createElement('div');
                    div.className = 'practice-item';
                    div.innerHTML = `
                        <div class="practice-zh">
                            <span>${idx + 1}. ${q.zh}</span>
                            <span class="practice-tag">${q.category}</span>
                        </div>
                        <textarea id="sentenceQ-${idx}" placeholder="请输入对应的英文翻译..." style="min-height:80px;"></textarea>
                        <div class="answer-toggle-area">
                            <button class="btn btn-outline btn-sm toggle-answer-btn" data-idx="${idx}">👁️ 查看答案</button>
                            <div id="sentenceAnswer-${idx}" class="answer-box">${q.en}</div>
                        </div>
                    `;
                    sentencePracticeContainer.appendChild(div);
                });

                document.querySelectorAll('.toggle-answer-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = this.getAttribute('data-idx');
                        const answerBox = document.getElementById(`sentenceAnswer-${idx}`);
                        if (answerBox.classList.contains('visible')) {
                            answerBox.classList.remove('visible');
                            this.textContent = '👁️ 查看答案';
                        } else {
                            answerBox.classList.add('visible');
                            this.textContent = '🙈 隐藏答案';
                        }
                    });
                });
            }

            function enterSentenceMode() {
                sentenceStudyMode.classList.add('hidden');
                sentencePracticeContainer.classList.remove('hidden');
                renderSentencePractice();
                sentenceStartBtn.classList.add('hidden');
                sentenceRetryBtn.classList.remove('hidden');
            }

            function resetSentence() {
                sentenceStudyMode.classList.remove('hidden');
                sentencePracticeContainer.classList.add('hidden');
                sentenceStartBtn.classList.remove('hidden');
                sentenceRetryBtn.classList.add('hidden');
                sentencePracticeContainer.innerHTML = '';
            }

            // ============================================================
            // 9. 模式切换
            // ============================================================
            const modeTabs = document.querySelectorAll('.mode-tab');
            const phrasePanel = document.getElementById('phrasePanel');
            const sentencePanel = document.getElementById('sentencePanel');

            modeTabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    modeTabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    const mode = this.getAttribute('data-mode');
                    if (mode === 'phrase') {
                        phrasePanel.classList.add('active');
                        sentencePanel.classList.remove('active');
                    } else {
                        sentencePanel.classList.add('active');
                        phrasePanel.classList.remove('active');
                    }
                });
            });

            // ============================================================
            // 10. 事件绑定
            // ============================================================
            phraseStartBtn.addEventListener('click', enterPhraseMode);
            phraseSubmitBtn.addEventListener('click', () => { if (phraseActive) { stopPhraseTimer();
                    submitPhraseCheck(); } });
            phraseReshuffleBtn.addEventListener('click', reshufflePhrase);
            phraseRetryBtn.addEventListener('click', resetPhrase);
            phraseExportBtn.addEventListener('click', exportPhraseResults);

            sentenceStartBtn.addEventListener('click', enterSentenceMode);
            sentenceRetryBtn.addEventListener('click', resetSentence);

            // ============================================================
            // 11. 初始化
            // ============================================================
            renderPhraseTables();
            renderSentenceTables();
        })();
    </script>
</body>
</html>
